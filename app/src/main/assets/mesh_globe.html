<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>ErikrafT Wi-Fi — Mesh Globe</title>
<style>
:root{color-scheme:dark;--blue:#4285f4;--green:#37d56a;--muted:#8b9bb0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#eef3fb;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.top{top:14px}.bottom{bottom:14px;justify-content:center}
.pill{background:rgba(13,21,31,.88);border:1px solid rgba(66,133,244,.28);border-radius:18px;padding:12px 14px;backdrop-filter:blur(10px);font-size:12px}
.brand{color:var(--green);font-size:15px;font-weight:700}.status{color:var(--muted);text-align:right;font-size:11px}
.controls{display:flex;gap:8px;pointer-events:auto}.controls button{border:1px solid #24364c;border-radius:14px;background:#111d2d;color:#eef3fb;padding:12px 16px;font:inherit}.controls button:active{background:#1c3555}
#detail{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);min-width:190px;text-align:center;background:rgba(12,22,31,.92);border:1px solid rgba(55,213,106,.35);border-radius:16px;padding:12px 20px;display:none}
#detail strong{display:block;color:var(--green);font-size:17px}#detail small{display:block;color:var(--muted);margin-top:5px}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive illustrative globe. Drag to rotate, pinch or use zoom buttons."></canvas>
<div class="overlay top"><div class="pill"><div class="brand">● ErikrafT / Wi-Fi</div><div style="font-size:10px;color:var(--muted);margin-top:5px"><span data-i18n="globeLabel">LAN PEER VIEW · NOT GEOLOCATED</span></div><div id="peerCount" style="font-size:11px;color:#37d56a;margin-top:6px">0 dispositivos encontrados</div></div><div class="pill status"><span data-i18n="instructions">Drag to rotate<br>Pinch to zoom · Tap a node</span></div></div>
<div id="detail"><strong>Node selected</strong><small data-i18n="sampleDetail">Illustrative point · Not a live peer</small></div>
<div class="overlay bottom"><div class="pill controls"><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">＋</button><button id="reset" data-i18n="reset">Reset view</button></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('scene'),ctx=c.getContext('2d'),detail=document.getElementById('detail');
let w=0,h=0,dpr=1,rot=-.55,tilt=.15,zoom=1,drag=null,lastPinch=0,livePeers=[];
const nodes=Array.from({length:48},(_,i)=>{const y=1-2*(i+.5)/48, a=Math.PI*(3-Math.sqrt(5))*i;return{x:Math.cos(a)*Math.sqrt(1-y*y),y,z:Math.sin(a)*Math.sqrt(1-y*y),live:i%4!==0,id:i+1}});
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=c.clientWidth;h=c.clientHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function project(p,R){let x=p.x*Math.cos(rot)+p.z*Math.sin(rot),z=-p.x*Math.sin(rot)+p.z*Math.cos(rot),y=p.y*Math.cos(tilt)-z*Math.sin(tilt);z=p.y*Math.sin(tilt)+z*Math.cos(tilt);return{x:w/2+x*R,y:h/2+y*R,z,visible:z>-.02}}
function line(a,b,R){const A=project(a,R),B=project(b,R);if(A.visible&&B.visible){ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}}
function draw(){if(!w||!h)return;ctx.clearRect(0,0,w,h);const R=Math.min(w*.46,h*.31)*zoom,cx=w/2,cy=h/2;
const glow=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.25);glow.addColorStop(0,'rgba(28,92,63,.18)');glow.addColorStop(1,'rgba(2,7,12,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
const sphere=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.08,cx,cy,R);sphere.addColorStop(0,'#1a2a2b');sphere.addColorStop(.65,'#0d1a1d');sphere.addColorStop(1,'#050a10');ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=sphere;ctx.fill();
ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
ctx.strokeStyle='rgba(105,143,151,.16)';ctx.lineWidth=.7;
for(let lat=-75;lat<=75;lat+=25){ctx.beginPath();for(let lon=0;lon<=360;lon+=3){const a=lon*Math.PI/180,b=lat*Math.PI/180,p=project({x:Math.cos(b)*Math.cos(a),y:Math.sin(b),z:Math.cos(b)*Math.sin(a)},R);if(lon===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke()}
for(let lon=0;lon<180;lon+=30){ctx.beginPath();for(let lat=-90;lat<=90;lat+=3){const a=lon*Math.PI/180,b=lat*Math.PI/180,p=project({x:Math.cos(b)*Math.cos(a),y:Math.sin(b),z:Math.cos(b)*Math.sin(a)},R);if(lat===-90)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke()}
ctx.strokeStyle='rgba(130,158,166,.45)';ctx.lineWidth=1.1;ctx.beginPath();ctx.ellipse(cx,cy,R,R*.32,0,0,Math.PI*2);ctx.stroke();
ctx.strokeStyle='rgba(66,133,244,.28)';ctx.beginPath();ctx.ellipse(cx,cy,R*.55,R,0,0,Math.PI*2);ctx.stroke();
// Stylized land contours are decorative only, not a navigational map.
ctx.strokeStyle='rgba(66,133,244,.34)';ctx.lineWidth=1.1;
const land=[[-.78,-.1],[-.66,-.34],[-.48,-.4],[-.37,-.23],[-.42,-.02],[-.55,.18],[-.62,.43],[-.73,.28],[-.84,.04],[-.78,-.1],[.02,-.52],[.22,-.62],[.42,-.5],[.54,-.32],[.43,-.18],[.22,-.12],[.13,.04],[.02,-.08],[-.06,-.31],[.02,-.52],[.26,.08],[.46,.03],[.62,.18],[.55,.43],[.42,.61],[.31,.42],[.24,.22],[.26,.08]];
ctx.beginPath();land.forEach((p,i)=>{const x=cx+p[0]*R,y=cy+p[1]*R;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
for(const n of nodes){const p=project(n,R);if(!p.visible)continue;ctx.beginPath();ctx.arc(p.x,p.y,n.live?2.2:1.4,0,Math.PI*2);ctx.fillStyle=n.live?'#7c8b97':'#65717c';ctx.globalAlpha=n.live?.52:.36;ctx.fill();ctx.globalAlpha=1}
for(let i=0;i<livePeers.length;i++){const n=peerPosition(livePeers[i],i),p=project(n,R);if(!p.visible)continue;ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.strokeStyle='rgba(66,133,244,.35)';ctx.lineWidth=1.2;ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,3.1,0,Math.PI*2);ctx.fillStyle='#4285f4';ctx.fill();}
ctx.restore();
ctx.strokeStyle='rgba(113,154,170,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
}
const translations={
en:{globeLabel:"LAN PEER VIEW · NOT GEOLOCATED",instructions:"Drag to rotate<br>Pinch to zoom · Tap a node",reset:"Reset view",sampleDetail:"Illustrative point · Not a live peer",count:n=>n+" device(s) discovered on the local network",peer:"Discovered via NSD/mDNS"},
"pt-BR":{globeLabel:"DISPOSITIVOS NA REDE LOCAL · SEM GEOLOCALIZAÇÃO",instructions:"Arraste para girar<br>Use zoom · Toque em um nó",reset:"Redefinir visualização",sampleDetail:"Ponto ilustrativo · Não é um dispositivo conectado",count:n=>n+" dispositivo(s) encontrado(s) na rede local",peer:"Descoberto via NSD/mDNS"},
es:{globeLabel:"DISPOSITIVOS LAN · SIN GEOLOCALIZACIÓN",instructions:"Arrastra para girar<br>Usa zoom · Toca un nodo",reset:"Restablecer vista",sampleDetail:"Punto ilustrativo · No es un dispositivo conectado",count:n=>n+" dispositivo(s) encontrado(s) en la red local",peer:"Descubierto mediante NSD/mDNS"},
fr:{globeLabel:"APPAREILS LAN · SANS GÉOLOCALISATION",instructions:"Faites glisser pour tourner<br>Zoom · Touchez un nœud",reset:"Réinitialiser",sampleDetail:"Point illustratif · Aucun appareil connecté",count:n=>n+" appareil(s) détecté(s) sur le réseau local",peer:"Découvert via NSD/mDNS"},
de:{globeLabel:"LAN-GERÄTE · OHNE GEOLOKALISIERUNG",instructions:"Ziehen zum Drehen<br>Zoom · Knoten antippen",reset:"Ansicht zurücksetzen",sampleDetail:"Illustrativer Punkt · Kein verbundenes Gerät",count:n=>n+" Gerät(e) im lokalen Netzwerk gefunden",peer:"Über NSD/mDNS entdeckt"},
it:{globeLabel:"DISPOSITIVI LAN · SENZA GEOLOCALIZZAZIONE",instructions:"Trascina per ruotare<br>Zoom · Tocca un nodo",reset:"Reimposta vista",sampleDetail:"Punto illustrativo · Nessun dispositivo connesso",count:n=>n+" dispositivo/i trovato/i nella rete locale",peer:"Rilevato tramite NSD/mDNS"},
ja:{globeLabel:"LAN デバイス · 位置情報なし",instructions:"ドラッグして回転<br>ズーム · ノードをタップ",reset:"表示をリセット",sampleDetail:"説明用ポイント · 接続デバイスではありません",count:n=>"ローカルネットワークで "+n+" 台を検出",peer:"NSD/mDNS で検出"},
"zh-CN":{globeLabel:"局域网设备 · 不代表地理位置",instructions:"拖动旋转<br>缩放 · 点击节点",reset:"重置视图",sampleDetail:"示意点 · 并非已连接设备",count:n=>"在本地网络中发现 "+n+" 台设备",peer:"通过 NSD/mDNS 发现"},
ru:{globeLabel:"УСТРОЙСТВА LAN · БЕЗ ГЕОЛОКАЦИИ",instructions:"Перетащите для вращения<br>Масштаб · Нажмите узел",reset:"Сбросить вид",sampleDetail:"Условная точка · Не подключённое устройство",count:n=>"Устройств в локальной сети: "+n,peer:"Обнаружено через NSD/mDNS"},
ar:{globeLabel:"أجهزة الشبكة المحلية · دون تحديد الموقع",instructions:"اسحب للتدوير<br>تكبير · اضغط على عقدة",reset:"إعادة ضبط العرض",sampleDetail:"نقطة توضيحية · ليست جهازًا متصلًا",count:n=>"الأجهزة المكتشفة على الشبكة المحلية: "+n,peer:"تم الاكتشاف عبر NSD/mDNS"},
hi:{globeLabel:"LAN डिवाइस · भौगोलिक स्थान नहीं",instructions:"घुमाने के लिए खींचें<br>ज़ूम · नोड टैप करें",reset:"दृश्य रीसेट करें",sampleDetail:"उदाहरण बिंदु · कनेक्टेड डिवाइस नहीं",count:n=>"स्थानीय नेटवर्क पर "+n+" डिवाइस मिले",peer:"NSD/mDNS से मिला"},
ko:{globeLabel:"LAN 장치 · 지리적 위치 아님",instructions:"드래그하여 회전<br>확대/축소 · 노드 탭",reset:"보기 초기화",sampleDetail:"예시 지점 · 연결된 장치가 아님",count:n=>"로컬 네트워크에서 장치 "+n+"개 발견",peer:"NSD/mDNS로 검색됨"},
nl:{globeLabel:"LAN-APPARATEN · GEEN GEOLOCATIE",instructions:"Sleep om te draaien<br>Zoom · Tik op een knooppunt",reset:"Weergave herstellen",sampleDetail:"Illustratief punt · Geen verbonden apparaat",count:n=>n+" apparaat/apparaten gevonden op het lokale netwerk",peer:"Gevonden via NSD/mDNS"},
pl:{globeLabel:"URZĄDZENIA LAN · BEZ GEOLOKALIZACJI",instructions:"Przeciągnij, aby obrócić<br>Zoom · Dotknij węzła",reset:"Resetuj widok",sampleDetail:"Punkt ilustracyjny · Brak połączonego urządzenia",count:n=>"Urządzenia w sieci lokalnej: "+n,peer:"Wykryto przez NSD/mDNS"},
tr:{globeLabel:"LAN CİHAZLARI · KONUM BİLGİSİ YOK",instructions:"Döndürmek için sürükleyin<br>Yakınlaştır · Düğüme dokunun",reset:"Görünümü sıfırla",sampleDetail:"Temsili nokta · Bağlı cihaz değil",count:n=>"Yerel ağda bulunan cihaz: "+n,peer:"NSD/mDNS ile bulundu"},
id:{globeLabel:"PERANGKAT LAN · TANPA GEOLOKASI",instructions:"Seret untuk memutar<br>Zoom · Ketuk node",reset:"Atur ulang tampilan",sampleDetail:"Titik ilustrasi · Bukan perangkat terhubung",count:n=>n+" perangkat ditemukan di jaringan lokal",peer:"Ditemukan melalui NSD/mDNS"}
};
const requestedLanguage=new URLSearchParams(window.location.search).get("lang");
const locale=(requestedLanguage||navigator.language||"en").toLowerCase(),language=locale.startsWith("pt")?"pt-BR":locale.startsWith("zh")?"zh-CN":locale.split("-")[0],t=translations[locale]||translations[language]||translations.en;
document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';
document.querySelectorAll("[data-i18n]").forEach(el=>{const key=el.getAttribute("data-i18n");if(t[key])el.innerHTML=t[key]});
function peerPosition(peer,index){let hash=0;const s=String(peer.name||peer.address||index);for(let i=0;i<s.length;i++)hash=((hash<<5)-hash+s.charCodeAt(i))|0;const lon=((Math.abs(hash)%360)/180)*Math.PI,lat=(((Math.abs(hash>>>8)%140)-70)/180)*Math.PI;return{x:Math.cos(lat)*Math.cos(lon),y:Math.sin(lat),z:Math.cos(lat)*Math.sin(lon)}}
window.ErikrafTMeshUpdatePeers=function(peers){livePeers=Array.isArray(peers)?peers:[];const count=document.getElementById('peerCount');if(count)count.textContent=t.count(livePeers.length);if(livePeers.length===0){detail.style.display='none'}draw()};
function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={...point(e),rot,tilt,moved:0};});
c.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),dx=p.x-drag.x,dy=p.y-drag.y;drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));rot=drag.rot+dx*.008;tilt=Math.max(-1.1,Math.min(1.1,drag.tilt+dy*.006));draw()});
c.addEventListener('pointerup',e=>{if(drag&&drag.moved<8){const p=point(e),R=Math.min(w*.46,h*.31)*zoom;let best=null,dist=20;for(let i=0;i<livePeers.length;i++){const q=project(peerPosition(livePeers[i],i),R),d=Math.hypot(q.x-p.x,q.y-p.y);if(q.visible&&d<dist){best={peer:livePeers[i]};dist=d}}if(!best){for(const n of nodes){const q=project(n,R),d=Math.hypot(q.x-p.x,q.y-p.y);if(q.visible&&d<dist){best={sample:n};dist=d}}}if(best){detail.style.display='block';if(best.peer){detail.querySelector('strong').textContent=best.peer.name||'Peer LAN';detail.querySelector('small').textContent=(best.peer.address||'LAN')+':'+(best.peer.port||'—')+' · '+t.peer}else{detail.querySelector('strong').textContent='Ponto ilustrativo';detail.querySelector('small').textContent=t.sampleDetail}}}drag=null});
c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.8,zoom+(e.deltaY<0?.08:-.08)));draw()},{passive:false});
document.getElementById('plus').onclick=()=>{zoom=Math.min(1.8,zoom+.12);draw()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.65,zoom-.12);draw()};document.getElementById('reset').onclick=()=>{rot=-.55;tilt=.15;zoom=1;detail.style.display='none';draw()};
window.addEventListener('resize',resize);resize();
})();
</script>
</body></html>
