name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing. Artifacts will be uploaded UNSIGNED; configure the four ANDROID_* repository secrets for signed release artifacts."
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/erikraft-wifi-release.jks"
          test -s "$RUNNER_TEMP/erikraft-wifi-release.jks"

      - name: Sign APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/erikraft-wifi-release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out app/build/outputs/apk/release/ErikrafT-WiFi-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/ErikrafT-WiFi-release.apk

      - name: Sign AAB
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -keystore "$RUNNER_TEMP/erikraft-wifi-release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB"

      - name: Prepare unsigned artifact names
        if: steps.signing.outputs.configured != 'true'
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ErikrafT-WiFi-UNSIGNED.apk
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/ErikrafT-WiFi-UNSIGNED.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ErikrafT-WiFi-Android-${{ steps.signing.outputs.configured == 'true' && 'signed' || 'unsigned' }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/ErikrafT-WiFi-*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/erikraft-wifi-release.jks"
