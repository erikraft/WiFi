name: Validate
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project files
        run: |
          test -s index.html
          test -s assets/css/styles.css
          test -s assets/js/main.js
          test -s assets/bitcoin-logo.svg
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/erikraft/wifi/MainActivity.java
          test -s app/src/main/java/com/erikraft/wifi/LanDiscovery.java
          test -s app/src/main/java/com/erikraft/wifi/GatewayManager.java
          test -s docs/internet-gateway.md
          test -s docs/internet-gateway_PT-BR.md
          test -s app/src/main/java/com/erikraft/wifi/AppStrings.java
          test -s app/src/main/java/com/erikraft/wifi/OfflineLibraryActivity.java
          test -s app/src/main/java/com/erikraft/wifi/OfflineArchiveProvider.java
          grep -q 'NET_CAPABILITY_VALIDATED' app/src/main/java/com/erikraft/wifi/GatewayManager.java
          grep -q 'refreshServiceAdvertisement' app/src/main/java/com/erikraft/wifi/LanDiscovery.java
          test -s app/src/main/assets/mesh_globe.html
          test -s docs/lan-discovery.md
          test -s docs/builds.md
          ! grep -Eq 'href="docs/[^"]+\.md"' index.html
          test -s docs/platform-compatibility.md
      - name: JavaScript syntax
        run: node --check assets/js/main.js
      - name: Interactive globe JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/mesh_globe.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.index('</script>', start)
          Path('/tmp/mesh-globe.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/mesh-globe.js
      - name: Android manifest XML
        run: python -c "import xml.etree.ElementTree as E; E.parse('app/src/main/AndroidManifest.xml')"
      - name: Validate site HTML
        run: python -c "from html.parser import HTMLParser; HTMLParser().feed(open('index.html', encoding='utf-8').read())"

  android-build:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ErikrafT-WiFi-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7